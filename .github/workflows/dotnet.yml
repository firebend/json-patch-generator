name: .NET

on:
  push:
    branches:
      - '!main'
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # The .NET 9 SDK supplies the net9.0 runtime for tests; global.json pins the SDK that builds.
        dotnet-version: 9.0.x
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore json-patch-generator.sln

    - name: Build
      run: dotnet build json-patch-generator.sln --no-restore

    - name: Test
      run: dotnet test json-patch-generator.sln --no-build --verbosity normal
